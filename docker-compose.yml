services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: a3lam:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-5}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
      A3LAM_ADMIN_ACCESS_TOKEN: ${A3LAM_ADMIN_ACCESS_TOKEN:?set A3LAM_ADMIN_ACCESS_TOKEN in .env}
      A3LAM_ADMIN_SESSION_TTL_SECONDS: ${A3LAM_ADMIN_SESSION_TTL_SECONDS:-28800}
      A3LAM_STORAGE_UPLOAD_URL: ${A3LAM_STORAGE_UPLOAD_URL:-}
      A3LAM_STORAGE_PUBLIC_BASE_URL: ${A3LAM_STORAGE_PUBLIC_BASE_URL:-}
      A3LAM_STORAGE_UPLOAD_TOKEN: ${A3LAM_STORAGE_UPLOAD_TOKEN:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - a3lam-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - a3lam-postgres-data:/var/lib/postgresql/data
    networks:
      - a3lam-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  a3lam-internal:
    driver: bridge

volumes:
  a3lam-postgres-data:
